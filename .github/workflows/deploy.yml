name: Deploy Headless Bot to Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      warp_action:
        description: 'WARP Action'
        required: true
        default: 'reconnect_with_ssh_fix'
        type: choice
        options:
          - 'reconnect_with_ssh_fix'
          - 'disconnect_only'
          - 'status'

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Disconnect WARP and Restore Standard Networking
        run: |
          echo "🛑 Disconnecting Cloudflare WARP to restore SSH..."
          warp-cli disconnect || true
          sleep 3
          echo "=== WARP Status ==="
          warp-cli status || true
          echo "=== IP Addresses ==="
          ip -4 addr
          echo "=== Routing Table ==="
          ip -4 route show
          echo "=== Policy Rules ==="
          ip rule show
          echo "✅ WARP is disconnected. SSH to 172.27.160.170 is restored!"

      - name: Deploy and restart container on VM
        run: |
          echo "🚀 Updating Headless Bot on Cloud VM via cac-automation runner..."
          
          TARGET_DIR=""
          for candidate in "/AUTO BOT" "$HOME/headless-bot" "$HOME/Auto_BOT" "/home/ubuntu/headless-bot" "/home/aditya_s_ctr_greyorange_com/headless-bot" "/home/aditya_s_ctr_greyorange_com/Auto_BOT"; do
            if [ -d "$candidate" ] && [ -f "$candidate/docker-compose.yml" ]; then
              TARGET_DIR="$candidate"
              break
            fi
          done

          if [ -n "$TARGET_DIR" ]; then
            cd "$TARGET_DIR"
          else
            FOUND=$(find "$HOME" -maxdepth 3 -name "docker-compose.yml" 2>/dev/null | head -n1)
            if [ -n "$FOUND" ]; then
              cd "$(dirname "$FOUND")"
            else
              echo "Current working directory: $(pwd)"
            fi
          fi

          echo "📁 Deploying in: $(pwd)"
          git fetch origin main || true
          git reset --hard origin/main || git pull origin main

          # Reclaim ownership of any root-owned files created by previous Docker runs
          sudo chown -R $(id -u):$(id -g) . 2>/dev/null || docker run --rm -v "$(pwd):/work" -w /work mcr.microsoft.com/playwright/python:v1.40.0-jammy chown -R $(id -u):$(id -g) . 2>/dev/null || true

          # Prevent OCI runtime directory-vs-file mount collisions
          # Clean up any stale directory placeholders created by previous Docker runs
          if [ -d sites_runtime.json ]; then
            rm -rf sites_runtime.json 2>/dev/null || sudo rm -rf sites_runtime.json 2>/dev/null || true
          fi
          if [ -d grafana_auth_state.json ]; then
            rm -rf grafana_auth_state.json 2>/dev/null || sudo rm -rf grafana_auth_state.json 2>/dev/null || true
          fi
          if [ -d .env ]; then
            rm -rf .env 2>/dev/null || sudo rm -rf .env 2>/dev/null || true
          fi

          # Ensure host mount targets exist as regular files before container start
          [ -f .env ] || cp .env.example .env 2>/dev/null || true
          [ -f sites.json ] || git checkout sites.json 2>/dev/null || echo '{"sites":[]}' > sites.json 2>/dev/null || true
          [ -f grafana_auth_state.json ] || echo "{}" > grafana_auth_state.json 2>/dev/null || true

          # Recreate container cleanly
          docker compose down || true
          docker compose up -d --build --force-recreate
          echo "✅ Deployment complete! Container status:"
          docker ps

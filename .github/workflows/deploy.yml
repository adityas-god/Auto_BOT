name: Deploy Headless Bot to Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Deploy and restart container on VM
        run: |
          echo "🚀 Updating Headless Bot on Cloud VM via cac-automation runner..."
          if [ -d "/AUTO BOT" ]; then
            cd "/AUTO BOT"
          elif [ -d "$HOME/headless-bot" ]; then
            cd "$HOME/headless-bot"
          elif [ -d "/home/ubuntu/headless-bot" ]; then
            cd "/home/ubuntu/headless-bot"
          else
            echo "Current working directory: $(pwd)"
          fi

          echo "📁 Deploying in: $(pwd)"
          git pull origin main
          [ -f .env ] || cp .env.example .env
          docker compose up -d --build
          echo "✅ Deployment complete! Container status:"
          docker ps
